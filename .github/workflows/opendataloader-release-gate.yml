name: OpenDataLoader Release Gate

on:
  push:
    branches:
      - odl-ci-validation
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'setup.py'
      - 'uv.lock'
      - 'Dockerfile'
      - 'process_worker.py'
      - 'raganything/parser/opendataloader_*.py'
      - 'raganything/processor/doc_processor.py'
      - 'raganything/routers/knowledge.py'
      - 'raganything/services/kb_service.py'
      - 'raganything/services/odl_artifact_lifecycle.py'
      - 'scripts/opendataloader_release_gate.py'
      - 'tests/test_odl_artifact_lifecycle.py'
      - 'tests/test_opendataloader_*.py'
      - '.github/workflows/opendataloader-release-gate.yml'
  workflow_dispatch:
    inputs:
      run_release_gate:
        description: 'Run the redistribution evidence gate (requires approved evidence files).'
        required: true
        default: false
        type: boolean
      source_revision:
        description: 'Immutable upstream OpenDataLoader source revision.'
        required: false
        type: string
      source_url:
        description: 'Immutable corresponding-source URL for that revision.'
        required: false
        type: string
      image_digest:
        description: 'Final pushed OCI image digest, sha256:...'
        required: false
        type: string

permissions:
  contents: read

jobs:
  lock:
    name: Locked dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.6.14'
      - name: Validate committed lock
        id: locked
        continue-on-error: true
        run: uv lock --locked
      - name: Capture resolver conflict evidence
        if: steps.locked.outcome == 'failure'
        run: |
          uv lock 2>&1 | tee resolver.log || true
          git diff -- uv.lock > uv-lock.diff || true
      - name: Upload resolver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opendataloader-resolver-evidence
          path: |
            resolver.log
            uv-lock.diff
          if-no-files-found: ignore
      - name: Fail when the committed lock is stale
        if: steps.locked.outcome == 'failure'
        run: exit 1

  install-smoke:
    name: Install smoke (${{ matrix.environment }})
    needs: lock
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: default
            extra: ''
            parser: mineru
          - environment: opendataloader
            extra: opendataloader
            parser: opendataloader
          - environment: marker
            extra: ''
            parser: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        if: matrix.environment == 'opendataloader'
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.6.14'
      - name: Install default or OpenDataLoader environment
        if: matrix.environment != 'marker'
        run: |
          if [ -n '${{ matrix.extra }}' ]; then
            uv sync --frozen --extra '${{ matrix.extra }}'
          else
            uv sync --frozen
          fi
      - name: Run parser installation smoke
        if: matrix.environment != 'marker'
        run: |
          uv run python -c "from raganything.parser import get_parser; p = get_parser('${{ matrix.parser }}'); assert p.check_installation()"
      - name: Run Linux controlled-volume artifact lifecycle tests
        if: matrix.environment == 'opendataloader'
        env:
          ODL_ARTIFACT_CLEANUP_MODE: linux-volume
        run: uv run python -m pytest -q tests/test_odl_artifact_lifecycle.py
      - name: Install Marker in a separate runtime only
        if: matrix.environment == 'marker'
        run: |
          python -m venv marker-runtime
          marker-runtime/bin/python -m pip install --upgrade pip
          marker-runtime/bin/python -m pip install marker-pdf
          marker-runtime/bin/python -c "import marker"

  container-smoke:
    name: Default and opt-in container smoke
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build default image
        run: docker build --target default --tag raganything:default .
      - name: Assert default image excludes Java and OpenDataLoader
        run: |
          docker run --rm --entrypoint sh raganything:default -c '! command -v java'
          docker run --rm --entrypoint python raganything:default -c "from importlib.util import find_spec; assert find_spec('opendataloader_pdf') is None"
      - name: Build opt-in image
        run: docker build --target opendataloader --tag raganything:opendataloader .
      - name: Assert opt-in Java and SDK versions
        run: |
          docker run --rm --entrypoint java raganything:opendataloader -version
          docker run --rm --entrypoint python raganything:opendataloader -c "from importlib.metadata import version; assert version('opendataloader-pdf') == '2.5.0'"
      - name: Run opt-in image real PDF adapter smoke
        run: |
          docker run --rm --entrypoint python raganything:opendataloader -c "from pathlib import Path; from tempfile import TemporaryDirectory; from pypdf import PdfWriter; from raganything.parser.opendataloader_parser import OpenDataLoaderParser; temp=TemporaryDirectory(); pdf=Path(temp.name)/'blank.pdf'; writer=PdfWriter(); [writer.add_blank_page(width=612, height=792) for _ in range(2)]; output=pdf.open('wb'); writer.write(output); output.close(); parser=OpenDataLoaderParser(timeout=120); assert parser.check_installation(); content=parser.parse_pdf(pdf, output_dir=temp.name); assert content.page_coverage == {'source_total_pages': 2, 'successful_pages': [], 'failed_pages': [], 'skipped_pages': [], 'blank_pages': [1, 2]}; temp.cleanup()"
      - name: Create dedicated Linux artifact volume
        run: docker volume create odl-artifact-lifecycle-ci
      - name: Prove opt-in image deletes only a registered controlled-volume run
        run: |
          docker run --rm -v odl-artifact-lifecycle-ci:/odl-artifacts -e ODL_ARTIFACT_ROOT=/odl-artifacts -e ODL_ARTIFACT_CLEANUP_MODE=linux-volume --entrypoint python raganything:opendataloader -c "from hashlib import sha256; from pathlib import Path; from raganything.services.odl_artifact_lifecycle import ArtifactOwner, OpenDataLoaderArtifactLifecycle, configured_odl_artifact_root; root=Path('/odl-artifacts'); root.chmod(0o700); assert configured_odl_artifact_root() == root; keep=root/'unregistered_sentinel'/'keep.txt'; keep.parent.mkdir(parents=True); keep.write_text('keep', encoding='utf-8'); run=root/'fixture_a1b2c3d4'/'run-12345678'; run.mkdir(parents=True); sidecar=run/'provenance.json'; sidecar.write_text('{}', encoding='utf-8'); lifecycle=OpenDataLoaderArtifactLifecycle(root); owner=ArtifactOwner('ci','doc-1'); record=lifecycle.register(owner, run_relpath='fixture_a1b2c3d4/run-12345678', sidecar_relpath='fixture_a1b2c3d4/run-12345678/provenance.json', sidecar_sha256=sha256(sidecar.read_bytes()).hexdigest()); assert lifecycle.delete(owner, expected_generation=record.generation, worker_exited=True).state == 'deleted'; assert not run.exists(); assert keep.read_text(encoding='utf-8') == 'keep'"
      - name: Remove dedicated Linux artifact volume
        if: always()
        run: docker volume rm -f odl-artifact-lifecycle-ci

  redistribution-evidence:
    name: Final artifact SBOM and legal gate
    if: github.event_name == 'workflow_dispatch' && inputs.run_release_gate
    needs: [lock, container-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download exact wheel and collect notices
        run: |
          mkdir -p release-artifacts
          python -m pip download --only-binary=:all: --no-deps --dest release-artifacts opendataloader-pdf==2.5.0
          python scripts/opendataloader_release_gate.py collect \
            --wheel release-artifacts/*.whl \
            --notice-root OSS_NOTICES/opendataloader-pdf \
            --manifest release-artifacts/release-manifest.json \
            --source-revision '${{ inputs.source_revision }}' \
            --source-url '${{ inputs.source_url }}'
      - name: Build final opt-in candidate for SBOM capture
        run: docker build --target opendataloader --tag raganything:opendataloader .
      - name: Generate wheel, JAR, and image SBOMs
        run: |
          docker run --rm -v "$PWD:/work" anchore/syft:v1.20.0 /work/release-artifacts -o cyclonedx-json=/work/release-artifacts/wheel.sbom.json
          docker run --rm -v "$PWD:/work" anchore/syft:v1.20.0 /work/OSS_NOTICES/opendataloader-pdf/jar -o cyclonedx-json=/work/release-artifacts/jar.sbom.json
          docker run --rm -v "$PWD:/work" -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.20.0 raganything:opendataloader -o cyclonedx-json=/work/release-artifacts/image.sbom.json
      - name: Fail closed on missing notices, SBOM data, reconciliation, or approval
        run: |
          python scripts/opendataloader_release_gate.py verify \
            --manifest release-artifacts/release-manifest.json \
            --notice-root OSS_NOTICES/opendataloader-pdf \
            --sbom release-artifacts/wheel.sbom.json \
            --sbom release-artifacts/jar.sbom.json \
            --sbom release-artifacts/image.sbom.json \
            --reconciliation release-evidence/opendataloader-pdf/reconciliation.json \
            --approval release-evidence/opendataloader-pdf/legal-approval.json \
            --image-digest '${{ inputs.image_digest }}'
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opendataloader-release-evidence
          path: |
            OSS_NOTICES/opendataloader-pdf
            release-artifacts
          if-no-files-found: warn
