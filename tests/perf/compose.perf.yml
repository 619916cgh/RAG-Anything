services:
  mock-provider:
    build:
      context: ../..
      dockerfile: tests/perf/Dockerfile.mock
    restart: "no"
    environment:
      PERF_EMBEDDING_DIM: ${PERF_EMBEDDING_DIM:-1536}
      PERF_MOCK_TTFT_MS: ${PERF_MOCK_TTFT_MS:-100}
      PERF_MOCK_TOKEN_INTERVAL_MS: ${PERF_MOCK_TOKEN_INTERVAL_MS:-20}
      PERF_MOCK_TOKEN_COUNT: ${PERF_MOCK_TOKEN_COUNT:-16}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?generated perf value required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated perf value required}
      POSTGRES_DB: ${POSTGRES_DATABASE:?generated perf value required}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: "no"
    volumes: ["redisdata:/data"]
  migrate:
    build: {context: ../.., target: default}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?generated perf value required}
      MIGRATION_BACKUP_ACKNOWLEDGED: "true"
    command: ["sh", "-ec", "python scripts/pg_migration_runner.py apply --backup-acknowledged"]
    depends_on: {postgres: {condition: service_healthy}}
  marker:
    build: {context: ../.., target: marker}
    restart: "no"
    environment:
      MARKER_PORT: 8765
      MARKER_INPUT_ROOTS: /app/uploads,/app/rag_storage,/app/output
      MARKER_OUTPUT_ROOT: /app/output
    volumes: ["uploads:/app/uploads:ro", "rag_storage:/app/rag_storage:ro", "output:/app/output"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/healthz', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: 8g
    cpus: 2
  app:
    build: {context: ../.., target: default}
    restart: "no"
    environment:
      RAGANYTHING_ENV: performance
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:?generated perf value required}
      JWT_SECRET: ${JWT_SECRET:?generated perf value required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?generated perf value required}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:?generated perf value required}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?generated perf value required}
      REDIS_URI: redis://redis:6379
      LLM_BINDING_HOST: http://mock-provider:18000/v1
      LLM_BINDING_API_KEY: perf-only
      LLM_MODEL: perf-mock
      EMBEDDING_MODEL: perf-mock
      EMBEDDING_DIM: ${PERF_EMBEDDING_DIM:-1536}
      ENABLE_METRICS: "true"
      MARKER_SERVICE_URL: http://marker:8765
      ENABLE_IMAGE_PROCESSING: "false"
      ENABLE_TABLE_PROCESSING: "false"
      ENABLE_EQUATION_PROCESSING: "false"
      DOCUMENT_WORKER_MAX_THREADS: "1"
    volumes: ["uploads:/app/uploads", "rag_storage:/app/rag_storage", "output:/app/output"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
      marker: {condition: service_healthy}
      mock-provider: {condition: service_healthy}
  nginx:
    build: {context: ../.., target: frontend}
    restart: "no"
    ports: ["127.0.0.1:${PERF_HTTP_PORT:?generated perf value required}:80"]
    depends_on: {app: {condition: service_started}}
volumes:
  pgdata: {}
  redisdata: {}
  uploads: {}
  rag_storage: {}
  output: {}
