services:
  mock-provider:
    image: ${PERF_APP_IMAGE:?existing app image required}
    command: ["python", "-m", "uvicorn", "mock_provider:app", "--host", "0.0.0.0", "--port", "18000"]
    working_dir: /perf
    volumes: ["${PERF_RUN_DIR:?run directory required}/mock_provider.py:/perf/mock_provider.py:ro"]
    environment:
      PERF_MOCK_TTFT_MS: ${PERF_MOCK_TTFT_MS:-100}
      PERF_MOCK_TOKEN_INTERVAL_MS: ${PERF_MOCK_TOKEN_INTERVAL_MS:-20}
      PERF_MOCK_TOKEN_COUNT: ${PERF_MOCK_TOKEN_COUNT:-16}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18000/openapi.json', timeout=5)"]
      interval: 5s
      timeout: 3s
      retries: 12
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 96
    labels: &perf_labels
      raganything.perf.run-id: ${PERF_RUN_ID:?generated run id required}
    logging: &bounded_logging
      driver: local
      options: {max-size: 5m, max-file: "2"}
  postgres:
    image: ${PERF_POSTGRES_IMAGE:?existing PostgreSQL image required}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?generated value required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated value required}
      POSTGRES_DB: ${POSTGRES_DATABASE:?generated value required}
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "${PERF_RUN_DIR:?run directory required}/pgvector-init.sql:/docker-entrypoint-initdb.d/00-vector.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 128
    labels: *perf_labels
    logging: *bounded_logging
  redis:
    image: ${PERF_REDIS_IMAGE:?existing Redis image required}
    volumes: ["redisdata:/data"]
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64
    labels: *perf_labels
    logging: *bounded_logging
  migrate:
    image: ${PERF_APP_IMAGE:?existing app image required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?generated value required}
      MIGRATION_BACKUP_ACKNOWLEDGED: "true"
    command: ["sh", "-ec", "python scripts/pg_migration_runner.py apply --backup-acknowledged"]
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 512m
    pids_limit: 128
    labels: *perf_labels
    logging: *bounded_logging
  marker:
    image: ${PERF_MARKER_IMAGE:?existing marker image required}
    environment:
      MARKER_PORT: "8765"
      MARKER_INPUT_ROOTS: /app/uploads,/app/rag_storage,/app/output
      MARKER_OUTPUT_ROOT: /app/output
    volumes: ["uploads:/app/uploads:ro", "rag_storage:/app/rag_storage:ro", "output:/app/output"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/healthz', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 8
    cpus: 2.0
    mem_limit: 8g
    pids_limit: 256
    labels: *perf_labels
    logging: *bounded_logging
  app:
    image: ${PERF_APP_IMAGE:?existing app image required}
    environment:
      RAGANYTHING_ENV: performance
      PERF_ISOLATED_RATE_LIMIT: ${PERF_ISOLATED_RATE_LIMIT:-}
      PERF_CPU_PROFILING: ${PERF_CPU_PROFILING:-0}
      PERF_SSE_PHASE_ATTRIBUTION: ${PERF_SSE_PHASE_ATTRIBUTION:-0}
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:?generated value required}
      JWT_SECRET: ${JWT_SECRET:?generated value required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?generated value required}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:?generated value required}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?generated value required}
      REDIS_URI: redis://redis:6379
      LLM_BINDING_HOST: ${PERF_LLM_BINDING_HOST:-http://mock-provider:18000/v1}
      LLM_BINDING_API_KEY: ${PERF_LLM_BINDING_API_KEY:-perf-only}
      LLM_MODEL: ${PERF_LLM_MODEL:-perf-mock}
      MODEL_PROFILE_CATALOG_FILE: /tmp/perf-model-profiles.json
      PROVIDER_GOVERNANCE_QWEN_QUOTA_VERIFIED: ${PERF_PROVIDER_GOVERNANCE_QWEN_QUOTA_VERIFIED:-}
      PROVIDER_GOVERNANCE_QWEN_REQUESTS_PER_MINUTE: ${PERF_PROVIDER_GOVERNANCE_QWEN_REQUESTS_PER_MINUTE:-}
      PROVIDER_GOVERNANCE_QWEN_TOKENS_PER_MINUTE: ${PERF_PROVIDER_GOVERNANCE_QWEN_TOKENS_PER_MINUTE:-}
      EMBEDDING_MODEL: ${PERF_EMBEDDING_MODEL:-perf-mock}
      EMBEDDING_DIM: ${PERF_EMBEDDING_DIM:-1536}
      VISION_EMBEDDING_HOST: ${PERF_VISION_EMBEDDING_HOST:-http://mock-provider:18000/v1}
      VISION_EMBEDDING_API_KEY: ${PERF_VISION_EMBEDDING_API_KEY:-perf-only}
      VISION_EMBEDDING_MODEL: ${PERF_VISION_EMBEDDING_MODEL:-perf-mock}
      VISION_EMBEDDING_DIM: "1536"
      ENABLE_METRICS: "true"
      MARKER_SERVICE_URL: http://marker:8765
      MAX_ASYNC: ${PERF_APP_MAX_ASYNC:-1}
      ENTITY_EXTRACT_CONCURRENCY: "1"
      DOCUMENT_WORKER_MAX_THREADS: "1"
      SERVER_WORKERS: "1"
      ENABLE_IMAGE_PROCESSING: "false"
      ENABLE_TABLE_PROCESSING: "false"
      ENABLE_EQUATION_PROCESSING: "false"
      PERF_CPU_PROFILE_KEY: ${PERF_CPU_PROFILE_KEY:-}
    volumes: ["uploads:/app/uploads", "rag_storage:/app/rag_storage", "output:/app/output", "${PERF_RUN_DIR:?run directory required}/model-profiles.json:/tmp/perf-model-profiles.json:ro"]
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_started}, mock-provider: {condition: service_started}, marker: {condition: service_healthy}}
    cpus: ${PERF_APP_CPUS:-2.0}
    mem_limit: ${PERF_APP_MEM_LIMIT:-3g}
    pids_limit: 512
    labels: *perf_labels
    logging: *bounded_logging
  nginx:
    image: ${PERF_NGINX_IMAGE:?existing nginx image required}
    ports: ["127.0.0.1:${PERF_HTTP_PORT:?generated port required}:80"]
    depends_on: {app: {condition: service_started}}
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 128
    labels: *perf_labels
    logging: *bounded_logging
volumes:
  pgdata: {labels: *perf_labels}
  redisdata: {labels: *perf_labels}
  uploads: {labels: *perf_labels}
  rag_storage: {labels: *perf_labels}
  output: {labels: *perf_labels}
networks:
  default:
    labels: *perf_labels
