services:
  postgres:
    image: ${ACCEPTANCE_POSTGRES_IMAGE:?pgvector image required}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DATABASE:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${ACCEPTANCE_RUN_DIR:?run directory required}/pgvector-init.sql:/docker-entrypoint-initdb.d/00-vector.sql:ro
    ports: ["127.0.0.1:${ACCEPTANCE_PG_PORT:?required}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    labels: &acceptance_labels
      raganything.acceptance.run-id: ${ACCEPTANCE_RUN_ID:?required}
      raganything.acceptance.owner: ${ACCEPTANCE_OWNER:?required}
  redis:
    image: ${ACCEPTANCE_REDIS_IMAGE:?redis image required}
    volumes: [redisdata:/data]
    labels: *acceptance_labels
  migrate:
    image: ${ACCEPTANCE_APP_IMAGE:?app image required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
    command: ["sh", "-ec", "python scripts/pg_migration_runner.py apply --backup-acknowledged"]
    depends_on:
      postgres: {condition: service_healthy}
    labels: *acceptance_labels
  app:
    image: ${ACCEPTANCE_APP_IMAGE:?app image required}
    stop_grace_period: 30s
    environment:
      RAGANYTHING_ENV: acceptance
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?required}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:?required}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?required}
      REDIS_URI: redis://redis:6379
      LLM_BINDING_HOST: http://mock-provider:18000/v1
      LLM_BINDING_API_KEY: acceptance-only
      LLM_MODEL: acceptance-mock
      EMBEDDING_MODEL: acceptance-mock
      EMBEDDING_DIM: "1536"
      VISION_EMBEDDING_HOST: http://mock-provider:18000/v1
      VISION_EMBEDDING_API_KEY: acceptance-only
      VISION_EMBEDDING_MODEL: acceptance-mock
      VISION_EMBEDDING_DIM: "1536"
      VISION_SEARCH_ENABLED: "true"
      ENABLE_VISION_EMBEDDING: "true"
      ENABLE_IMAGE_PROCESSING: "false"
      ENABLE_TABLE_PROCESSING: "false"
      ENABLE_EQUATION_PROCESSING: "false"
      ENABLE_AUDIO_TRANSCRIPTION: "false"
      DOCUMENT_WORKER_MAX_THREADS: "1"
      SERVER_WORKERS: "1"
      ENABLE_METRICS: "true"
    volumes:
      - uploads:/app/uploads
      - rag_storage:/app/rag_storage
      - output:/app/output
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
      mock-provider: {condition: service_healthy}
    labels: *acceptance_labels
  mock-provider:
    image: ${ACCEPTANCE_APP_IMAGE:?app image required}
    working_dir: /acceptance
    command: ["python", "-m", "uvicorn", "mock_provider:app", "--host", "0.0.0.0", "--port", "18000"]
    volumes:
      - ${ACCEPTANCE_RUN_DIR:?run directory required}/mock_provider.py:/acceptance/mock_provider.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18000/openapi.json', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 20
    labels: *acceptance_labels
  nginx:
    image: ${ACCEPTANCE_FRONTEND_IMAGE:?frontend image required}
    ports: ["127.0.0.1:${ACCEPTANCE_HTTP_PORT:?required}:80"]
    volumes:
      - ${ACCEPTANCE_RUN_DIR:?run directory required}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: {app: {condition: service_started}}
    labels: *acceptance_labels
  fixture:
    image: ${ACCEPTANCE_APP_IMAGE:?app image required}
    working_dir: /acceptance
    command: ["python", "/acceptance/generate_video_fixture.py", "/acceptance"]
    environment:
      ACCEPTANCE_RUN_ID: ${ACCEPTANCE_RUN_ID:?required}
      ACCEPTANCE_OWNER: ${ACCEPTANCE_OWNER:?required}
    volumes:
      - ${ACCEPTANCE_RUN_DIR:?run directory required}:/acceptance
    labels: *acceptance_labels
  browser:
    image: ${ACCEPTANCE_BROWSER_IMAGE:?browser image required}
    profiles: [browser]
    working_dir: /acceptance/run
    command: ["node", "/acceptance/run/video_browser_uat.mjs"]
    environment:
      VIDEO_BROWSER_BASE_URL: http://nginx
      VIDEO_BROWSER_ACCOUNTS_PATH: /acceptance/run/browser-accounts.json
      VIDEO_BROWSER_EVIDENCE_PATH: /acceptance/run/browser-stage-evidence.json
      VIDEO_BROWSER_FIXTURE: /acceptance/run/video-fixture.mp4
      VIDEO_BROWSER_COMPAT_FIXTURES: /acceptance/run/compatibility.txt,/acceptance/run/compatibility.png,/acceptance/run/compatibility.pdf
      VIDEO_BROWSER_LEGACY_RESOURCE_PATH: /acceptance/run/legacy-browser-resource.json
      VIDEO_BROWSER_PHASE_A: ${VIDEO_BROWSER_PHASE_A:-0}
      VIDEO_BROWSER_UPLOAD_DIAGNOSIS: ${VIDEO_BROWSER_UPLOAD_DIAGNOSIS:-0}
      HOME: /acceptance/run/browser-profile
      XDG_CACHE_HOME: /acceptance/run/browser-profile/cache
      XDG_CONFIG_HOME: /acceptance/run/browser-profile/config
    volumes:
      - ${ACCEPTANCE_RUN_DIR:?run directory required}:/acceptance/run
    depends_on: {nginx: {condition: service_started}}
    labels: *acceptance_labels
volumes:
  pgdata: {labels: *acceptance_labels}
  redisdata: {labels: *acceptance_labels}
  uploads: {labels: *acceptance_labels}
  rag_storage: {labels: *acceptance_labels}
  output: {labels: *acceptance_labels}
networks:
  default: {labels: *acceptance_labels}
